<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第 13 课：相机与深度</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #141418; }
    #glcanvas { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: fixed; top: 12px; left: 12px; padding: 8px 12px;
      font: 14px/1.4 system-ui, sans-serif; color: #e8e8ec;
      background: rgba(0, 0, 0, 0.45); border-radius: 6px; pointer-events: none;
    }
    #error {
      position: fixed; inset: 0; margin: 0; padding: 24px; overflow: auto;
      font: 14px/1.5 ui-monospace, monospace; color: #ffb4b4;
      background: rgba(20, 0, 0, 0.92); white-space: pre-wrap; z-index: 10;
    }
    #error[hidden] { display: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" aria-label="WebGL2 画布"></canvas>
  <div id="overlay">第 13 课 · lookAt 轨道相机 · DEPTH_TEST · 网格 + 两立方体遮挡</div>
  <pre id="error" hidden></pre>

  <script src="../_shared/webgl2-bootstrap.js"></script>
  <script src="../_shared/webgl2-math.js"></script>
  <script>
    (function () {
      var boot = window.WebGL2Bootstrap;
      var math = window.WebGL2Math;
      var canvas = document.getElementById('glcanvas');

      function drawMesh(gl, program, mesh, uniforms, model, view, projection, color) {
        gl.uniformMatrix4fv(uniforms.uProjection, false, projection);
        gl.uniformMatrix4fv(uniforms.uView, false, view);
        gl.uniformMatrix4fv(uniforms.uModel, false, model);
        gl.uniform3fv(uniforms.uColor, color);
        gl.bindVertexArray(mesh.vao);
        if (mesh.indexCount) {
          gl.drawElements(gl.TRIANGLES, mesh.indexCount, mesh.indexType, 0);
        } else {
          gl.drawArrays(mesh.mode, 0, mesh.vertexCount);
        }
      }

      function draw(gl, program, grid, cube, uniforms, timeSeconds) {
        boot.resizeCanvasToDisplaySize(canvas, gl);
        boot.clearColorAndDepth(gl);
        gl.useProgram(program);

        var aspect = canvas.width / canvas.height;
        var projection = math.mat4Perspective(Math.PI / 4, aspect, 0.2, 50.0);
        var eye = math.orbitEye(timeSeconds, 4.0, 2.0, [0, 0.3, 0]);
        var view = math.mat4LookAt(eye, [0, 0.3, 0], [0, 1, 0]);

        drawMesh(gl, program, grid, uniforms, math.mat4Identity(), view, projection, [0.35, 0.38, 0.42]);

        var modelA = math.mat4Multiply(
          math.mat4Translate(-0.6, 0.5, 0.2),
          math.mat4RotateY(timeSeconds * 0.4)
        );
        drawMesh(gl, program, cube, uniforms, modelA, view, projection, [0.85, 0.35, 0.3]);

        var modelB = math.mat4Multiply(
          math.mat4Translate(0.5, 0.5, -0.3),
          math.mat4RotateY(timeSeconds * 0.6 + 1.0)
        );
        drawMesh(gl, program, cube, uniforms, modelB, view, projection, [0.3, 0.55, 0.95]);
      }

      function start() {
        var gl = boot.initWebGL2(canvas);
        boot.enableDepthTest(gl);
        var grid = math.createGridLineMesh(gl, 4, 16);
        var cube = math.createCubeMesh(gl);

        return boot.createProgramFromUrls(gl, 'vertex.glsl', 'fragment.glsl').then(function (program) {
          var uniforms = {
            uModel: gl.getUniformLocation(program, 'uModel'),
            uView: gl.getUniformLocation(program, 'uView'),
            uProjection: gl.getUniformLocation(program, 'uProjection'),
            uColor: gl.getUniformLocation(program, 'uColor')
          };
          boot.startRenderLoop(function (timeMs) {
            draw(gl, program, grid, cube, uniforms, timeMs * 0.001);
          });
        });
      }

      start().catch(function (err) {
        boot.showError(
          (err && err.message ? err.message : String(err)) +
          '\n\n提示：请通过本地静态服务器打开本页（file:// 下 fetch .glsl 通常会失败）。\n' +
          '例如在仓库根目录运行：npx serve 或 python3 -m http.server'
        );
      });
    })();
  </script>
</body>
</html>
